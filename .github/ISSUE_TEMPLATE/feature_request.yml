name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: input
    id: spec-versions
    attributes:
      label: Specifications, versions or devices where you need it
      placeholder: "e.g. VAST 4.2 SIMID, OpenRTB 2.6 multi-format, Pixel Fold"
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
