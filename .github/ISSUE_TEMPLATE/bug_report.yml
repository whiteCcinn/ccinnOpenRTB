name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please redact real tracker hosts, tokens and encrypted prices from responses you paste.
        Security issues (for example a way to make a tracker leave the Mac in Simulated mode) should be reported privately (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Paste the response below (or pick the sample …)
        2. Choose device … and placement …
        3. …
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: CcinnOpenRTB version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: spec-version
    attributes:
      label: Input type and version (OpenRTB / Native / VAST)
      placeholder: "OpenRTB 2.6 bid, Native 1.2 adm — or VAST 4.1 wrapper chain"
    validations:
      required: true
  - type: input
    id: device-mode
    attributes:
      label: Device, placement and tracking mode
      placeholder: "iPhone 16 Pro, interstitial, Simulated"
  - type: textarea
    id: response
    attributes:
      label: Minimal bid response or markup (redact real tracker hosts)
      render: json
  - type: input
    id: macos-version
    attributes:
      label: macOS version and Mac type
      placeholder: "macOS 15.2, Apple silicon"
  - type: textarea
    id: logs
    attributes:
      label: Error messages or screenshots
